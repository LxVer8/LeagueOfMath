<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoL Arena Stat Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main-grid">
    <div class="section champion-section">
      <h2>Pick a Champion</h2>
      <input type="text" class="search-input" id="championSearch" placeholder="Search champions…">
      <div class="level-input-container">
        <label for="levelInput">Level:</label>
        <input type="number" id="levelInput" value="1" min="1" max="18">
      </div>
      <div class="selection-grid" id="championGrid"><p style="color:#aaa; text-align:center;">Loading…</p></div>
    </div>
    <div class="section items-section">
      <h2>Pick Items (max 6)</h2>
      <input type="text" class="search-input" id="itemSearch" placeholder="Search items…">
      <div class="hotbar" id="selectedItemsBar"></div>
      <div class="selection-grid" id="itemGrid"><p style="color:#aaa; text-align:center;">Loading…</p></div>
    </div>
    <div class="section augments-section">
      <h2>Pick Augments (max 6)</h2>
      <input type="text" class="search-input" id="augmentSearch" placeholder="Search augments…">
      <div class="hotbar" id="selectedAugmentsBar"></div>
      <div class="selection-grid" id="augmentGrid"><p style="color:#aaa; text-align:center;">Loading…</p></div>
    </div>
    <div class="section stats-section">
      <h2>Full Stats</h2>
      <table class="stats-table" id="statsTable"><tr><td colspan="2">Select a champion</td></tr></table>
    </div>
  </div>

  <script src="championPassives.js"></script>
  <script src="statCalculator.js"></script>
  <script src="statsDisplay.js"></script>
  <script>
    (function() {
      const state = {
        selectedChampion: null,
        selectedItems: new Set(),
        selectedAugments: new Set(),
        level: 1,
        hats: 0,
        activeElixir: null
      };
      const MAX_SELECTIONS = 6;
      let championsData = {}, itemsData = {}, augments = [], ddVersion = '';
      let itemStatsData = {};

      // Item configuration loaded from items.json (or fallback)
      let ARENA_ITEM_NAMES, JUICE_NAMES, ELIXIR_NAMES, CUSTOM_ITEM_ICONS,
          SR_COMPONENT_ALLOWED, ALLOWED_CONSUMABLES, REMOVED_NAMES;

      const championGrid = document.getElementById('championGrid');
      const itemGrid = document.getElementById('itemGrid');
      const augmentGrid = document.getElementById('augmentGrid');
      const selectedItemsBar = document.getElementById('selectedItemsBar');
      const selectedAugmentsBar = document.getElementById('selectedAugmentsBar');
      const levelInput = document.getElementById('levelInput');
      const statsTable = document.getElementById('statsTable');
      const championSearch = document.getElementById('championSearch');
      const itemSearch = document.getElementById('itemSearch');
      const augmentSearch = document.getElementById('augmentSearch');

      // Original hard-coded lists (used as fallback if items.json is missing)
      const FALLBACK_ARENA_ITEMS = [
        "Cappa Juice","Juice of Haste","Juice of Power","Juice of Vitality",
        "Black Hole Gauntlet","Cloak of Starry Night","Crown of the Shattered Queen",
        "Cruelty","Darksteel Talons","Decapitator","Demon King's Crown",
        "Demonic Embrace","Detonation Orb","Diamond-Tipped Spear","Divine Sunderer",
        "Dragonheart","Duskblade of Draktharr","Eleisa's Miracle","Empyrean Promise",
        "Everfrost","Flesheater","Force of Entropy","Fulmination","Galeforce",
        "Gambler's Blade","Gargoyle Stoneplate","Ghostcrawlers","Goredrinker",
        "Hamstringer","Hemomancer's Helm","Hexbolt Companion","Innervating Locket",
        "Kinkou Jitte","Mirage Blade","Moonflair Spellblade","Lightning Rod",
        "Night Harvester","Prowler's Claw","Puppeteer","Pyromancer's Cloak",
        "Radiant Virtue","Reality Fracture","Reaper's Toll","Regicide",
        "Reverberation","Rite of Ruin","Runecarver","Sanguine Gift",
        "Shield of Molten Stone","Sword of the Divine","Talisman of Ascension",
        "Turbo Chemtank","Twilight's Edge","Twin Mask","Anathema's Chains",
        "Atma's Reckoning","Hellfire Hatchet","Perplexity","Spectral Cutlass",
        "Sword of Blossoming Dawn","The Golden Spatula","Wooglet's Witchcap",
        "Wordless Promise","Zephyr"
      ];
      const FALLBACK_JUICE_NAMES = ["Cappa Juice","Juice of Haste","Juice of Power","Juice of Vitality"];
      const FALLBACK_ELIXIR_NAMES = ["Elixir of Iron","Elixir of Sorcery","Elixir of Wrath"];
      const FALLBACK_CUSTOM_ICONS = {
        "Innervating Locket": "https://wiki.leagueoflegends.com/en-us/images/Innervating_Locket_item.png?23f50",
        "Sunfire Aegis": "https://wiki.leagueoflegends.com/en-us/images/Sunfire_Aegis_item.png?bcdcc",
        "Zephyr": "https://wiki.leagueoflegends.com/en-us/images/Zephyr_item.png?6194a"
      };
      const FALLBACK_SR_COMPONENT_ALLOWED = ["Whispering Circlet"];
      const FALLBACK_REMOVED_NAMES = [
        "Cull","Recall","Disabled Recall","Total Biscuit of Everlasting Will",
        "Trailblazer","Chemtech Putrifier","Mejai's Soulstealer","Deathfire Grasp",
        "Leeching Leer","Stirring Wardstone","Veigar's Talisman",
        "Veigar's Talisman of Ascension","Gustwalker Hatchling","Mosstomper Seedling",
        "Scorchclaw Pup","Gunmetal Greaves"
      ];

      function positionTooltip(tooltip, icon, grid) {
        tooltip.style.display = 'block';
        tooltip.style.visibility = 'hidden';
        const tooltipRect = tooltip.getBoundingClientRect();
        const gridRect = grid.getBoundingClientRect();
        const iconRect = icon.getBoundingClientRect();
        const padding = 4;
        const tooltipWidth = tooltipRect.width;
        const tooltipHeight = tooltipRect.height;
        let placeAbove = true;
        const spaceAbove = iconRect.top - gridRect.top;
        if (spaceAbove < tooltipHeight + padding) placeAbove = false;
        if (placeAbove) {
          tooltip.style.top = 'auto';
          tooltip.style.bottom = '110%';
        } else {
          tooltip.style.bottom = 'auto';
          tooltip.style.top = '110%';
        }
        let left = iconRect.left + iconRect.width / 2 - tooltipWidth / 2;
        const minLeft = gridRect.left + padding;
        const maxLeft = gridRect.right - tooltipWidth - padding;
        if (left < minLeft) left = minLeft;
        if (left > maxLeft) left = maxLeft;
        tooltip.style.left = (left - iconRect.left) + 'px';
        tooltip.style.transform = 'none';
        tooltip.style.visibility = 'visible';
      }

      function resetTooltip(tooltip) {
        tooltip.style.display = '';
        tooltip.style.visibility = '';
        tooltip.style.left = '50%';
        tooltip.style.transform = 'translateX(-50%)';
        tooltip.style.top = 'auto';
        tooltip.style.bottom = '110%';
      }

      async function loadItemStats() {
        try {
          const res = await fetch('itemStats.json');
          if (!res.ok) throw new Error('Failed to fetch itemStats.json');
          itemStatsData = await res.json();
          console.log(`Loaded item stats for ${Object.keys(itemStatsData).length} items from local file.`);
        } catch(e) {
          console.warn('Could not load itemStats.json, using empty map', e);
          itemStatsData = {};
        }
      }

      async function loadData() {
        try {
          console.log('Fetching version...');
          const versionsRes = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
          if (!versionsRes.ok) throw new Error('Version fetch failed');
          const versions = await versionsRes.json();
          ddVersion = versions[0];
          console.log('Latest version:', ddVersion);

          const [champsRes, itemsRes] = await Promise.all([
            fetch(`https://ddragon.leagueoflegends.com/cdn/${ddVersion}/data/en_US/champion.json`),
            fetch(`https://ddragon.leagueoflegends.com/cdn/${ddVersion}/data/en_US/item.json`)
          ]);
          if (!champsRes.ok || !itemsRes.ok) throw new Error('Data fetch failed');

          championsData = (await champsRes.json()).data;
          itemsData = (await itemsRes.json()).data;
          console.log(`Loaded ${Object.keys(championsData).length} champions, ${Object.keys(itemsData).length} items.`);

          await loadItemStats();

          // ----- Load item configuration (static lists) -----
          let config = {};
          try {
            const configRes = await fetch('items.json');
            if (configRes.ok) {
              config = await configRes.json();
              console.log('Item configuration loaded from items.json.');
            } else {
              console.warn('items.json not found – using built‑in fallback.');
            }
          } catch(e) {
            console.warn('Could not load items.json – using built‑in fallback.', e);
          }

          // Populate constants (from config or fallback)
          ARENA_ITEM_NAMES   = new Set(config.arenaItemNames     || FALLBACK_ARENA_ITEMS);
          JUICE_NAMES        = new Set(config.juiceNames          || FALLBACK_JUICE_NAMES);
          ELIXIR_NAMES       = new Set(config.elixirNames         || FALLBACK_ELIXIR_NAMES);
          CUSTOM_ITEM_ICONS  = config.customItemIcons             || FALLBACK_CUSTOM_ICONS;
          SR_COMPONENT_ALLOWED= new Set(config.srComponentAllowed || FALLBACK_SR_COMPONENT_ALLOWED);
          REMOVED_NAMES      = new Set(config.removedNames        || FALLBACK_REMOVED_NAMES);
          ALLOWED_CONSUMABLES = new Set([...ELIXIR_NAMES, ...JUICE_NAMES]);

          // Load augments
          try {
            const augRes = await fetch('augments.json');
            if (augRes.ok) {
              augments = await augRes.json();
              augments = augments.filter(aug => {
                if (!aug.name || !isNaN(Number(aug.name))) return false;
                if (!aug.desc || aug.desc.trim().length < 5) return false;
                return true;
              });
              console.log(`Loaded ${augments.length} augments from file.`);
            } else {
              console.warn('augments.json not found, using empty list');
            }
          } catch(e) {
            console.warn('Could not load augments.json', e);
            augments = [];
          }

          renderAll();
        } catch (error) {
          console.error('FATAL load error:', error);
          championGrid.innerHTML = '<p style="color:red;">Failed to load champions.</p>';
          itemGrid.innerHTML = '<p style="color:red;">Failed to load items.</p>';
          augmentGrid.innerHTML = '<p style="color:red;">Failed to load augments.</p>';
        }
      }

      function renderAll() {
        try { renderChampions(); } catch(e) { console.error('renderChampions error:', e); }
        try { renderItems(); } catch(e) { console.error('renderItems error:', e); }
        try { renderAugments(); } catch(e) { console.error('renderAugments error:', e); }
        updateSelectedItemsBar();
        updateSelectedAugmentsBar();
        calculateStats();
      }

      function renderChampions() {
        championGrid.innerHTML = '';
        const entries = Object.entries(championsData);
        if (entries.length === 0) {
          championGrid.innerHTML = '<p style="color:orange;">No champion data found.</p>';
          return;
        }
        const rankedEntries = entries.filter(([key, champ]) => !key.startsWith('Jade_'));
        if (rankedEntries.length === 0) {
          championGrid.innerHTML = '<p style="color:orange;">No ranked champions found.</p>';
          return;
        }
        rankedEntries.forEach(([key, champ]) => {
          const div = document.createElement('div');
          div.className = 'selection-item';
          div.dataset.championKey = key;
          const img = document.createElement('img');
          img.src = `https://ddragon.leagueoflegends.com/cdn/${ddVersion}/img/champion/${key}.png`;
          img.alt = champ.name;
          img.onerror = () => { img.remove(); div.textContent = champ.name.charAt(0); };
          div.appendChild(img);
          if (state.selectedChampion === key) div.classList.add('selected');
          div.addEventListener('click', () => selectChampion(key, div));
          championGrid.appendChild(div);
        });
        console.log('Rendered champions:', rankedEntries.length);
      }

      function renderItems() {
        itemGrid.innerHTML = '';
        console.log('Filtering items...');

        const isInvalidBase = (item) => {
          if (!item.gold?.total || item.gold.total <= 0) return true;
          const name = item.name;
          if (item.tags && item.tags.includes('Consumable')) {
            if (!ALLOWED_CONSUMABLES.has(name)) return true;
          }
          if (item.tags && (item.tags.includes('Trinket') || item.tags.includes('GoldPer'))) return true;
          if (/doran/i.test(name)) return true;
          if (/^Guardian's/.test(name)) return true;
          if (item.tags && item.tags.includes('Boots')) return true;
          return REMOVED_NAMES.has(name);
        };

        const elixirItems = [];
        const srItems = [];
        const arenaItems = [];

        Object.entries(itemsData).forEach(([id, item]) => {
          if (isInvalidBase(item)) return;
          const name = item.name;

          if (ELIXIR_NAMES.has(name)) {
            elixirItems.push({ id, item });
            return;
          }

          if (ARENA_ITEM_NAMES.has(name)) {
            arenaItems.push({ id, item });
            return;
          }

          const hasSRMap = item.maps && (item.maps['11'] || item.maps['21']);
          if (!hasSRMap) return;
          if (item.into && item.into.length > 0 && !SR_COMPONENT_ALLOWED.has(name)) return;
          srItems.push({ id, item });
        });

        const dedup = (arr) => {
          const map = new Map();
          arr.forEach(({ id, item }) => {
            const existing = map.get(item.name);
            if (!existing || item.gold.total > existing.item.gold.total) {
              map.set(item.name, { id, item });
            }
          });
          return Array.from(map.values());
        };

        const elixirUnique = dedup(elixirItems).sort((a, b) =>
          a.item.name.localeCompare(b.item.name, 'en', { sensitivity: 'base' })
        );
        const srUnique = dedup(srItems).sort((a, b) =>
          a.item.name.localeCompare(b.item.name, 'en', { sensitivity: 'base' })
        );

        // Split arena items into juices and the rest
        const juiceItems = [];
        const otherArenaItems = [];
        arenaItems.forEach(({ id, item }) => {
          if (JUICE_NAMES.has(item.name)) {
            juiceItems.push({ id, item });
          } else {
            otherArenaItems.push({ id, item });
          }
        });
        const juiceUnique = dedup(juiceItems).sort((a, b) =>
          a.item.name.localeCompare(b.item.name, 'en', { sensitivity: 'base' })
        );
        const otherArenaUnique = dedup(otherArenaItems).sort((a, b) =>
          a.item.name.localeCompare(b.item.name, 'en', { sensitivity: 'base' })
        );

        console.log(`Elixirs: ${elixirUnique.length}, SR: ${srUnique.length}, Juices: ${juiceUnique.length}, Other Arena: ${otherArenaUnique.length}`);

        // Clear selected items that are no longer valid
        const allValidIds = new Set([
          ...srUnique.map(e => e.id),
          ...juiceUnique.filter(e => e.item.name !== 'Cappa Juice').map(e => e.id),
          ...otherArenaUnique.map(e => e.id)
        ]);
        for (const id of state.selectedItems) {
          if (!allValidIds.has(id)) state.selectedItems.delete(id);
        }
        if (state.activeElixir && !elixirUnique.some(e => e.id === state.activeElixir)) {
          state.activeElixir = null;
        }
        updateSelectedItemsBar();

        const createItemElement = (id, item, customClickHandler) => {
          const div = document.createElement('div');
          div.className = 'selection-item';
          div.dataset.itemId = id;
          const img = document.createElement('img');
          img.src = CUSTOM_ITEM_ICONS[item.name] || `https://ddragon.leagueoflegends.com/cdn/${ddVersion}/img/item/${id}.png`;
          img.alt = item.name;
          img.onerror = () => { img.remove(); div.textContent = item.name.charAt(0); };
          div.appendChild(img);

          const tooltip = document.createElement('span');
          tooltip.className = 'tooltip';
          tooltip.innerHTML = `<strong>${item.name}</strong>${item.description || ''}`;
          div.appendChild(tooltip);

          if (ELIXIR_NAMES.has(item.name)) {
            if (state.activeElixir === id) div.classList.add('selected');
          } else if (item.name !== 'Cappa Juice') {
            if (state.selectedItems.has(id)) div.classList.add('selected');
          }

          const clickHandler = customClickHandler || (() => toggleItem(id, div));
          div.addEventListener('click', clickHandler);

          div.addEventListener('mouseenter', () => positionTooltip(tooltip, div, itemGrid));
          div.addEventListener('mouseleave', () => resetTooltip(tooltip));

          return div;
        };

        // --- Elixir section ---
        if (elixirUnique.length > 0) {
          const elixirHeader = document.createElement('div');
          elixirHeader.className = 'items-header';
          elixirHeader.textContent = 'Elixirs';
          itemGrid.appendChild(elixirHeader);

          elixirUnique.forEach(({ id, item }) => {
            const elixirClick = () => {
              if (state.activeElixir === id) {
                state.activeElixir = null;
              } else {
                state.activeElixir = id;
              }
              document.querySelectorAll('#itemGrid .selection-item[data-item-id]').forEach(el => {
                const iid = el.dataset.itemId;
                if (ELIXIR_NAMES.has(itemsData[iid]?.name)) {
                  el.classList.toggle('selected', state.activeElixir === iid);
                }
              });
              calculateStats();
            };
            itemGrid.appendChild(createItemElement(id, item, elixirClick));
          });
        }

        // ---- "All Legendary Items" header ----
        const legendHeader = document.createElement('div');
        legendHeader.className = 'items-header';
        legendHeader.textContent = 'All Legendary Items';
        itemGrid.appendChild(legendHeader);

        // SR items
        srUnique.forEach(({ id, item }) => {
          itemGrid.appendChild(createItemElement(id, item));
        });

        // ---- Arena section (Juices + Arena Exclusive) ----
        if (juiceUnique.length > 0 || otherArenaUnique.length > 0) {
          if (juiceUnique.length > 0) {
            const juiceHeader = document.createElement('div');
            juiceHeader.className = 'items-header';
            juiceHeader.textContent = 'Juices';
            itemGrid.appendChild(juiceHeader);

            juiceUnique.forEach(({ id, item }) => {
              if (item.name === 'Cappa Juice') {
                const cappaClick = () => {
                  state.hats += 1;
                  calculateStats();
                };
                itemGrid.appendChild(createItemElement(id, item, cappaClick));
              } else {
                itemGrid.appendChild(createItemElement(id, item));
              }
            });
          }

          if (otherArenaUnique.length > 0) {
            const arenaHeader = document.createElement('div');
            arenaHeader.className = 'items-header';
            arenaHeader.textContent = 'Arena Exclusive Items';
            itemGrid.appendChild(arenaHeader);

            otherArenaUnique.forEach(({ id, item }) => {
              itemGrid.appendChild(createItemElement(id, item));
            });
          }
        }

        // Search filter
        const filterItems = () => {
          const q = itemSearch.value.toLowerCase();
          for (const child of itemGrid.children) {
            if (child.classList.contains('items-header')) continue;
            const itemId = child.dataset?.itemId;
            if (itemId) {
              const item = itemsData[itemId];
              child.style.display = item?.name.toLowerCase().includes(q) ? '' : 'none';
            }
          }
          const headers = itemGrid.querySelectorAll('.items-header');
          headers.forEach(header => {
            let anyVisible = false;
            let next = header.nextElementSibling;
            while (next) {
              if (!next.classList.contains('items-header') && next.style.display !== 'none') {
                anyVisible = true;
                break;
              }
              next = next.nextElementSibling;
            }
            header.style.display = anyVisible ? '' : 'none';
          });
        };

        itemSearch.removeEventListener('input', filterItems);
        itemSearch.addEventListener('input', filterItems);
        filterItems();
      }

      function renderAugments() {
        augmentGrid.innerHTML = '';
        if (augments.length === 0) {
          augmentGrid.innerHTML = '<p style="color:orange;">No augment data. Run the scraper to get augments.json.</p>';
          return;
        }
        augments.forEach((aug, idx) => {
          const div = document.createElement('div');
          div.className = 'selection-item';
          div.dataset.augmentIndex = idx;
          if (aug.icon) {
            const img = document.createElement('img');
            img.src = aug.icon;
            img.alt = aug.name;
            img.onerror = () => { img.remove(); div.textContent = aug.name.charAt(0); div.style.backgroundColor = getColor(idx); };
            div.appendChild(img);
          } else {
            div.textContent = aug.name.charAt(0);
            div.style.backgroundColor = getColor(idx);
            div.style.display = 'flex'; div.style.alignItems = 'center'; div.style.justifyContent = 'center';
            div.style.fontSize = '1.2rem'; div.style.fontWeight = 'bold';
          }

          const tooltip = document.createElement('span');
          tooltip.className = 'tooltip';
          tooltip.innerHTML = `<strong>${aug.name}</strong>${aug.desc}`;
          div.appendChild(tooltip);

          if (state.selectedAugments.has(idx)) div.classList.add('selected');
          div.addEventListener('click', () => toggleAugment(idx, div));

          div.addEventListener('mouseenter', () => positionTooltip(tooltip, div, augmentGrid));
          div.addEventListener('mouseleave', () => resetTooltip(tooltip));

          augmentGrid.appendChild(div);
        });
        console.log('Rendered augments:', augments.length);
      }

      function getColor(i) { return ['#3c5a77','#5e4b3c','#2e5a4b','#6b4e5a','#4a6e5f'][i%5]; }

      function updateSelectedItemsBar() {
        selectedItemsBar.innerHTML = '';
        const arr = Array.from(state.selectedItems);
        for (let i = 0; i < MAX_SELECTIONS; i++) {
          const slot = document.createElement('div');
          slot.className = 'hotbar-slot';
          if (i < arr.length) {
            const id = arr[i];
            slot.classList.add('filled');
            const img = document.createElement('img');
            img.src = `https://ddragon.leagueoflegends.com/cdn/${ddVersion}/img/item/${id}.png`;
            slot.appendChild(img);
            const rm = document.createElement('span');
            rm.className = 'remove-x'; rm.textContent = '×';
            rm.addEventListener('click', (e) => { e.stopPropagation(); deselectItem(id); });
            slot.appendChild(rm);
            slot.addEventListener('click', () => deselectItem(id));
          }
          selectedItemsBar.appendChild(slot);
        }
      }

      function updateSelectedAugmentsBar() {
        selectedAugmentsBar.innerHTML = '';
        const arr = Array.from(state.selectedAugments);
        for (let i = 0; i < MAX_SELECTIONS; i++) {
          const slot = document.createElement('div');
          slot.className = 'hotbar-slot';
          if (i < arr.length) {
            const idx = arr[i];
            const aug = augments[idx];
            slot.classList.add('filled');
            if (aug.icon) {
              const img = document.createElement('img');
              img.src = aug.icon;
              slot.appendChild(img);
            } else {
              slot.style.backgroundColor = getColor(idx);
              slot.style.display = 'flex'; slot.style.alignItems = 'center'; slot.style.justifyContent = 'center';
              slot.style.fontSize = '0.7rem'; slot.style.fontWeight = 'bold';
              slot.textContent = aug.name.charAt(0);
            }
            const rm = document.createElement('span');
            rm.className = 'remove-x'; rm.textContent = '×';
            rm.addEventListener('click', (e) => { e.stopPropagation(); deselectAugment(idx); });
            slot.appendChild(rm);
            slot.addEventListener('click', () => deselectAugment(idx));
          }
          selectedAugmentsBar.appendChild(slot);
        }
      }

      function selectChampion(key, el) {
        document.querySelectorAll('#championGrid .selection-item.selected').forEach(e => e.classList.remove('selected'));
        state.selectedChampion = key;
        el.classList.add('selected');
        calculateStats();
      }

      function toggleItem(id, el) {
        if (state.selectedItems.has(id)) {
          state.selectedItems.delete(id);
          el.classList.remove('selected');
        } else {
          if (state.selectedItems.size >= MAX_SELECTIONS) return;
          state.selectedItems.add(id);
          el.classList.add('selected');
        }
        updateSelectedItemsBar();
        calculateStats();
      }

      function toggleAugment(idx, el) {
        if (state.selectedAugments.has(idx)) {
          state.selectedAugments.delete(idx);
          el.classList.remove('selected');
        } else {
          if (state.selectedAugments.size >= MAX_SELECTIONS) return;
          state.selectedAugments.add(idx);
          el.classList.add('selected');
        }
        updateSelectedAugmentsBar();
        calculateStats();
      }

      function deselectItem(id) {
        state.selectedItems.delete(id);
        updateSelectedItemsBar();
        const el = document.querySelector(`#itemGrid .selection-item[data-item-id="${id}"]`);
        if (el) el.classList.remove('selected');
        calculateStats();
      }

      function deselectAugment(idx) {
        state.selectedAugments.delete(idx);
        updateSelectedAugmentsBar();
        const el = document.querySelector(`#augmentGrid .selection-item[data-augment-index="${idx}"]`);
        if (el) el.classList.remove('selected');
        calculateStats();
      }

      championSearch.addEventListener('input', () => {
        const q = championSearch.value.toLowerCase();
        document.querySelectorAll('#championGrid .selection-item').forEach(el => {
          el.style.display = championsData[el.dataset.championKey]?.name.toLowerCase().includes(q) ? '' : 'none';
        });
      });

      augmentSearch.addEventListener('input', () => {
        const q = augmentSearch.value.toLowerCase();
        document.querySelectorAll('#augmentGrid .selection-item').forEach(el => {
          const idx = parseInt(el.dataset.augmentIndex);
          el.style.display = augments[idx]?.name.toLowerCase().includes(q) ? '' : 'none';
        });
      });

      levelInput.addEventListener('input', () => {
        state.level = parseInt(levelInput.value) || 1;
        calculateStats();
      });

      // This is now the only place that calls the external stats module
      function calculateStats() {
        statsTable.innerHTML = generateStatsHTML({
          championKey:      state.selectedChampion,
          championsData:    championsData,
          level:            state.level,
          selectedItems:    state.selectedItems,
          activeElixir:     state.activeElixir,
          selectedAugments: state.selectedAugments,
          hats:             state.hats,
          itemStatsData:    itemStatsData,
          augments:         augments
        });
      }

      loadData();
    })();
  </script>
</body>
</html>
